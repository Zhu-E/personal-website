<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost at sea · Edward Zhu</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&amp;family=DM+Mono:wght@400;500&amp;family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 18px; padding: 24px 16px; }
    .lost .num { font: 800 clamp(4rem, 14vw, 8rem)/1 var(--serif); color: var(--vermilion); margin: 0; }
    .lost h1 { font: 700 clamp(1.4rem, 3.5vw, 2rem)/1.3 var(--serif); margin: 0; }
    .lost p { margin: 0 auto; max-width: 36ch; color: var(--ink-3); }
    .lost .btn-outline { justify-self: center; margin-top: 10px; text-decoration: none; font-weight: 500; }
    .lost .btn-outline:hover { background: var(--vermilion); border-color: var(--vermilion); color: var(--on-vermilion); }
  </style>
</head>
<body>
  <main class="lost">
    <p class="num">404</p>
    <h1>Lost at sea.</h1>
    <p>This page drifted off, or it was never here to begin with.</p>
    <a class="btn-outline" href="/">Back to shore</a>
  </main>
</body>
</html>
